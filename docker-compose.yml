services:
  kafka:
    image: confluentinc/cp-kafka:7.8.0
    hostname: kafka
    container_name: activation-poc-kafka-1
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29094'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka:29092,EXTERNAL://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29094'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:29092"]
      interval: 10s
      timeout: 10s 
      retries: 12
      start_period: 20s

  kafka-init:
    image: confluentinc/cp-kafka:7.8.0
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./docker/create-topics.sh:/opt/kafka-init/create-topics.sh:ro
    entrypoint: ["/bin/sh", "/opt/kafka-init/create-topics.sh"]
    environment:
      KAFKA_BOOTSTRAP_SERVER: kafka:29092
    restart: "no"

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.1.0
    ports:
      - "8080:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "false"
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  mongo:
    image: mongo:8.0.4
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval '
          try {
            const hello = db.hello();
            if (hello.isWritablePrimary) quit(0);
          } catch (error) {}
          try {
            const status = rs.status();
            if (status.ok !== 1) quit(1);
          } catch (error) {
            if (error.code === 94 || error.codeName === "NotYetInitialized") {
              const result = rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo:27017"}]});
              if (result.ok !== 1) quit(1);
            } else {
              quit(1);
            }
          }
          quit(db.hello().isWritablePrimary ? 0 : 1)'
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"

  core-services:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: core-services
    ports:
      - "3000:3000"
    environment:
      KAFKA_BROKERS: kafka:29092
      KAFKA_CLIENT_ID: core-services
      KAFKA_GROUP_ID: core-services
      MONGO_URI: mongodb://mongo:27017/activation_db?replicaSet=rs0
      PORT: 3000
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy

  activation-worker:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: activation-worker
    environment:
      KAFKA_BROKERS: kafka:29092
      KAFKA_CLIENT_ID: activation-worker
      KAFKA_GROUP_ID: activation-worker
      MONGO_URI: mongodb://mongo:27017/activation_db?replicaSet=rs0
      KAFKA_FROM_BEGINNING: "false"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy

  billing-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: billing-service
    environment:
      KAFKA_BROKERS: kafka:29092
      KAFKA_CLIENT_ID: billing-service
      KAFKA_GROUP_ID: billing-service
      MONGO_URI: mongodb://mongo:27017/activation_db?replicaSet=rs0
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy

  provisioning-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: provisioning-service
    environment:
      KAFKA_BROKERS: kafka:29092
      KAFKA_CLIENT_ID: provisioning-service
      KAFKA_GROUP_ID: provisioning-service
      MONGO_URI: mongodb://mongo:27017/activation_db?replicaSet=rs0
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: notification-service
    environment:
      KAFKA_BROKERS: kafka:29092
      KAFKA_CLIENT_ID: notification-service
      KAFKA_GROUP_ID: notification-service
      MONGO_URI: mongodb://mongo:27017/activation_db?replicaSet=rs0
      MAILHOG_HOST: mailhog
      MAILHOG_PORT: 1025
      NOTIFICATION_FROM: notificaciones@activation-poc.local
      NOTIFICATION_TO: cliente@demo.local
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
      mailhog:
        condition: service_started

  crm-analytics-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: crm-analytics-service
    environment:
      KAFKA_BROKERS: kafka:29092
      KAFKA_CLIENT_ID: crm-analytics-service
      KAFKA_GROUP_ID: crm-analytics-service
      KAFKA_FROM_BEGINNING: "false"
      MONGO_URI: mongodb://mongo:27017/activation_db?replicaSet=rs0
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy

  loyalty-service:
    profiles: ["loyalty"]
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: loyalty-service
    environment:
      KAFKA_BROKERS: kafka:29092
      KAFKA_CLIENT_ID: loyalty-service
      KAFKA_GROUP_ID: ${LOYALTY_KAFKA_GROUP_ID:-loyalty-service-replay}
      MONGO_URI: mongodb://mongo:27017/activation_db?replicaSet=rs0
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy

  demo-ui:
    build:
      context: .
      dockerfile: Dockerfile.demo-ui
      args:
        VITE_ACTIVATION_API_URL: http://localhost:3000
        VITE_ACTIVATION_SOCKET_URL: http://localhost:3000
    ports:
      - "5173:80"
    depends_on:
      - core-services

volumes:
  kafka-data:
